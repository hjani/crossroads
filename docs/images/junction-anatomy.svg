="angle" points="6.883,-9.830 6.477,-10.102 6.060,-10.357 5.634,-10.595 5.198,-10.816 4.753,-11.019 4.300,-11.203 3.841,-11.369 3.375,-11.516 2.903,-11.644 2.427,-11.752 1.946,-11.841 1.462,-11.911 0.976,-11.960 0.489,-11.990 0.000,-12.000 -0.489,-11.990 -0.976,-11.960 -1.462,-11.911 -1.946,-11.841 -2.427,-11.752 -2.903,-11.644 -3.375,-11.516 -3.841,-11.369 -4.300,-11.203 -4.753,-11.019 -5.198,-10.816 -5.634,-10.595 -6.060,-10.357 -6.477,-10.102 -6.883,-9.830"/><text x="8.205133554287267e-16" y="-13.4" font-size="1.05" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1d2125">gap</text><circle cx="7.683928507884663" cy="-4" r="0.3" fill="#d6336c"/><text x="9.103145840969818" y="-4.738797781176054" font-size="1.05" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1d2125">corner P</text><circle cx="8.881784197001252e-16" cy="-6.9737871824843936" r="0.3" fill="#d6336c"/><text x="1.0919537048263258e-15" y="-8.573787182484393" font-size="1.05" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1d2125">corner P</text><circle cx="-3.276608177155968" cy="2.2943057454041833" r="0.3" fill="#d6336c"/><circle cx="0" cy="4" r="0.3" fill="#d6336c"/><text x="-4.259590630302759" y="2.982597469025438" font-size="1.05" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1d2125">T</text><text x="0" y="5.2" font-size="1.05" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1d2125">T</text><text x="-3.324590015292248" y="6.386477998883195" font-size="1.05" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1d2125">round join</text><text x="4.742495197427439" y="4.937573474361248" font-size="1.05" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1d2125">curb</text><text x="6.825042628890369" y="-7.60494901626657" font-size="1.05" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#1d2125">roadway end</text><circle cx="0" cy="0" r="0.3" fill="#d6336c"/><text x="-0.8" y="-0.9" font-size="1.05" font-weight="600" text-anchor="end" dominant-baseline="middle" fill="#1d2125">node N</text><text x="14.818681599723014" y="-18.02134497435782" font-size="1.05" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#1d2125">leg</text><text x="-10.89795229066987" y="-15.563888841490849" font-size="1.05" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#5b6168">roadway</text><text x="-1.8021344974357827" y="1.261868159972301" font-size="1.05" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#5b6168">junction</text></svg>
<text x="20" y="578" font-size="12" fill="#5b6168">Three 8 m roads. Dashed: each leg's centerline. Thick: where each roadway</text>
<text x="20" y="598" font-size="12" fill="#5b6168">ends; teal: the junction's curbs. The leg at 55° is set back by its narrower</text>
<text x="20" y="618" font-size="12" fill="#5b6168">gap, so a curb runs from its end back to the corner of its wider one.</text>
</svg>
