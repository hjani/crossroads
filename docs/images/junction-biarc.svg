<rect x="20" y="472" width="18" height="14" fill="#d6336c" stroke="#2b2f33" stroke-width="0.6"/><text x="46" y="484">first piece, node N to J, and its curbs</text><rect x="320" y="472" width="18" height="14" fill="#1c7ed6" stroke="#2b2f33" stroke-width="0.6"/><text x="346" y="484">second piece, and its continuation back from J</text>
<text x="20" y="528" font-size="12" fill="#5b6168">1: the biarc is crossed before its join J, and its setback runs past J: the junction covers the whole</text>
<text x="20" y="548" font-size="12" fill="#5b6168">first piece, and the roadway begins on the second, where the junction ends.</text>
<text x="20" y="568" font-size="12" fill="#5b6168">2: the junction is worked out again on the second piece, continued back from J. That misses N, and</text>
<text x="20" y="588" font-size="12" fill="#5b6168">the curb found on it runs off the road's own between N and J; the roadway's end still lies on the road.</text>
</svg>
