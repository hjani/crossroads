<text x="20" y="422">Dashed: the box every arrow fits in, A long. The shaft narrows from the tail.</text>
<text x="20" y="446">Straight among the turns: the straight arrow, and a branch per turn, leaving the shaft already angled off it</text>
<text x="20" y="470">and curving into a smaller turn head. Turns only: the shaft's end curves into a turn head, the straight head</text>
<text x="20" y="494">turned 90°. Left: right mirrored.</text>
<text x="20" y="530" font-size="12" fill="#5b6168">To scale, the outlines the app draws: a 3 m lane.</text>
