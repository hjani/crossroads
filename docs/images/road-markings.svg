="5.54" font-size="0.6" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#d6336c">P′</text><path d="M0.000,-1.000 L1.583,-1.000 M0.000,-0.760 L0.000,-1.240 M1.583,-0.760 L1.583,-1.240" fill="none" stroke="#d6336c" stroke-width="1.5" vector-effect="non-scaling-stroke"/><text x="0.7916666666666666" y="-1.54" font-size="0.6" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#d6336c">½ gap</text><path d="M24.000,3.700 L24.000,-3.700 M24.240,3.700 L23.760,3.700 M24.240,-3.700 L23.760,-3.700" fill="none" stroke="#d6336c" stroke-width="1.5" vector-effect="non-scaling-stroke"/><text x="23.46" y="0" font-size="0.6" font-weight="600" text-anchor="end" dominant-baseline="middle" fill="#d6336c">W</text><text x="24.6" y="3" font-size="0.6" fill="#5b6168">junction</text><text x="-1.6" y="-5" font-size="0.6" fill="#5b6168">roadway</text></svg>
