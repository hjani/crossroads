<svg x="20" y="430" width="280" height="280" viewBox="19.8 -4.4 2 2"><g fill="#dde6d2"><polygon points="-10.000,20.000 42.000,20.000 42.000,-20.000 -10.000,-20.000" /></g><g fill="#66655f"><polygon points="-2.000,4.000 22.000,4.000 22.000,-4.000 -2.000,-4.000" /></g><g fill="#c9cfd6"><polygon points="22.000,4.000 30.000,4.000 30.000,-4.000 22.000,-4.000" /></g><g fill="#ffffff"><polygon points="-2.000,-3.700 22.000,-3.700 22.000,-3.800 -2.000,-3.800" /><polygon points="-2.000,3.800 22.000,3.800 22.000,3.700 -2.000,3.700" /><polygon points="1.583,0.050 3.167,0.050 3.167,-0.050 1.583,-0.050" /><polygon points="6.333,0.050 7.917,0.050 7.917,-0.050 6.333,-0.050" /><polygon points="11.083,0.050 12.667,0.050 12.667,-0.050 11.083,-0.050" /><polygon points="15.833,0.050 17.417,0.050 17.417,-0.050 15.833,-0.050" /><polygon points="19.000,3.436 22.000,3.436 22.000,2.907 19.000,2.907" /><polygon points="19.000,2.379 22.000,2.379 22.000,1.850 19.000,1.850" /><polygon points="19.000,1.321 22.000,1.321 22.000,0.793 19.000,0.793" /><polygon points="19.000,0.264 22.000,0.264 22.000,-0.264 19.000,-0.264" /><polygon points="19.000,-0.793 22.000,-0.793 22.000,-1.321 19.000,-1.321" /><polygon points="19.000,-1.850 22.000,-1.850 22.000,-2.379 19.000,-2.379" /><polygon points="19.000,-2.907 22.000,-2.907 22.000,-3.436 19.000,-3.436" /></g><path d="M20.100,-4.000 L20.100,-3.800 M20.052,-4.000 L20.148,-4.000 M20.052,-3.800 L20.148,-3.800" fill="none" stroke="#d6336c" stroke-width="1.5" vector-effect="non-scaling-stroke"/><text x="20.208000000000002" y="-3.9" font-size="0.12" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#d6336c">e</text><path d="M20.100,-3.800 L20.100,-3.700 M20.052,-3.800 L20.148,-3.800 M20.052,-3.700 L20.148,-3.700" fill="none" stroke="#d6336c" stroke-width="1.5" vector-effect="non-scaling-stroke"/><text x="20.208000000000002" y="-3.75" font-size="0.12" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#d6336c">ℓ</text><text x="20.4" y="-4.15" font-size="0.12" fill="#5b6168">curb</text><text x="20.4" y="-3.25" font-size="0.12" fill="#5b6168">crossing bar</text></svg>
<text x="330" y="454">e: the edge line's gap from the curb. ℓ: a line's width.</text>
<text x="330" y="478">Centerline dashes: a fitted pattern, period P′, the middle third of each</text>
<text x="330" y="502">period; half a gap at each end of the dashed stretch.</text>
<text x="330" y="526">Crossing: D deep, at an end meeting 3 or more roads. Bars run along the</text>
<text x="330" y="550">road, a fitted pattern across W, the width between the edge lines; each</text>
<text x="330" y="574">bar is half its period.</text>
<text x="330" y="610" font-size="12" fill="#5b6168">To scale: 8 m road, the project's own constants and fitted pattern.</text>
</svg>
