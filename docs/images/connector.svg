<rect x="20" y="572" width="18" height="14" fill="#5b6168" stroke="#2b2f33" stroke-width="0.6"/><text x="46" y="584">On offer: leaving the start, arriving at the far end</text><rect x="460" y="572" width="18" height="14" fill="#d6336c" stroke="#2b2f33" stroke-width="0.6"/><text x="486" y="584">The ones picked, and the connector</text>
<text x="20" y="626">Dotted: the cursor. Leaving the capture circle picks the start's; its last stretch, as the end welds, the far end's.</text>
<text x="20" y="650" font-size="12" fill="#5b6168">The far end offers the directions a start there would, turned around. Sliding on carries its pick; pulling away drops it.</text>
