<text x="460" y="436">hi − lo = 7 cm, under the tolerance → R = lo = 4.84 m,</text>
<text x="460" y="454">7 cm short of R* — the safe side: a little more than c from C.</text>

<text x="20" y="482">A test: the turn at R — straight on along the lane line, its arc, straight on — clear of the curbs</text>
<text x="20" y="500">and corners, and past no corner? ✓ raises lo to R, ✗ lowers hi to R. Blue: [lo, hi] after the test.</text>
