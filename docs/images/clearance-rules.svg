<text x="20" y="360">Nodes at least R₁ + R₂ apart:</text>
<text x="20" y="380">the circles don't overlap.</text>
<text x="350" y="360">Centerline at least R + w/2 from</text>
<text x="350" y="380">the node: the band stays off the circle.</text>
<text x="680" y="360">Centerlines at least w₁/2 + w₂/2</text>
<text x="680" y="380">apart: the bands don't overlap.</text>
<text x="20" y="418" font-size="12" fill="#5b6168">Dashed: each junction's circle, radius R, around its node, wide enough to cover its outline. 8 m roads. Parts sharing a node are exempt.</text>
