<text x="20" y="480"><tspan font-weight="600">P</tspan>: the curbs on the gap's side cross ahead of the node → both roads end square through P.</text>
<text x="20" y="504"><tspan font-weight="600">T</tspan>: the wider road's curb touches the circle about N, radius its w/2 → not set back.</text>
<text x="20" y="528"><tspan font-weight="600">X</tspan>: a narrower road's curb crosses that circle → it ends square through X.</text>
<text x="20" y="554" font-size="12" fill="#5b6168">Thick lines: where each roadway ends. Dashed: centerlines, and the circle round joins follow.</text>
