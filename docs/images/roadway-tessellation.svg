<svg xmlns="http://www.w3.org/2000/svg" width="880" height="510" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1d2125">
<style>.tri { stroke: #2b2f33; stroke-width: 0.8px; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
     .guide { stroke: #d6336c; stroke-width: 1px; stroke-dasharray: 4 4; fill: none; vector-effect: non-scaling-stroke; }</style>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="24" font-weight="600">Straight: one slice at each end, one quad</text>
<text x="460" y="24" font-weight="600">Arc: slices along the radii</text>
<svg x="20" y="34" width="400" height="400" viewBox="-2 -14 28 28"><polygon points="0.000,-4.000 24.000,-4.000 24.000,4.000" class="tri" fill="#9a9993"/><polygon points="0.000,-4.000 24.000,4.000 0.000,4.000" class="tri" fill="#9a9993"/></svg>
<svg x="460" y="34" width="400" height="400" viewBox="-2 -2 20 20"><polygon points="0.000,8.000 1.251,7.902 2.503,15.803" class="tri" fill="#9a9993"/><polygon points="0.000,8.000 2.503,15.803 0.000,16.000" class="tri" fill="#9a9993"/><polygon points="1.251,7.902 2.472,7.608 4.944,15.217" class="tri" fill="#b9b8b1"/><polygon points="1.251,7.902 4.944,15.217 2.503,15.803" class="tri" fill="#b9b8b1"/><polygon points="2.472,7.608 3.632,7.128 7.264,14.256" class="tri" fill="#9a9993"/><polygon points="2.472,7.608 7.264,14.256 4.944,15.217" class="tri" fill="#9a9993"/><polygon points="3.632,7.128 4.702,6.472 9.405,12.944" class="tri" fill="#b9b8b1"/><polygon points="3.632,7.128 9.405,12.944 7.264,14.256" class="tri" fill="#b9b8b1"/><polygon points="4.702,6.472 5.657,5.657 11.314,11.314" class="tri" fill="#9a9993"/><polygon points="4.702,6.472 11.314,11.314 9.405,12.944" class="tri" fill="#9a9993"/><polygon points="5.657,5.657 6.472,4.702 12.944,9.405" class="tri" fill="#b9b8b1"/><polygon points="5.657,5.657 12.944,9.405 11.314,11.314" class="tri" fill="#b9b8b1"/><polygon points="6.472,4.702 7.128,3.632 14.256,7.264" class="tri" fill="#9a9993"/><polygon points="6.472,4.702 14.256,7.264 12.944,9.405" class="tri" fill="#9a9993"/><polygon points="7.128,3.632 7.608,2.472 15.217,4.944" class="tri" fill="#b9b8b1"/><polygon points="7.128,3.632 15.217,4.944 14.256,7.264" class="tri" fill="#b9b8b1"/><polygon points="7.608,2.472 7.902,1.251 15.803,2.503" class="tri" fill="#9a9993"/><polygon points="7.608,2.472 15.803,2.503 15.217,4.944" class="tri" fill="#9a9993"/><polygon points="7.902,1.251 8.000,0.000 16.000,-0.000" class="tri" fill="#b9b8b1"/><polygon points="7.902,1.251 16.000,-0.000 15.803,2.503" class="tri" fill="#b9b8b1"/><path class="guide" d="M0,0 L7.264,14.256 M0,0 L14.256,7.264"/><circle r="0.3" fill="#d6336c"/><text x="0.6" y="-0.6" font-size="1.1" fill="#d6336c">arc center</text></svg>
<text x="20" y="464">Two triangles between each pair of neighboring slices; the shades alternate per quad.</text>
<text x="20" y="488" font-size="12" fill="#5b6168">Arc slices are spaced so the outer edge strays at most 5 cm from its circle. 8 m roads, arc R = 12 m.</text>
