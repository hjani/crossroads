<text x="20" y="360">Wider spread over narrower, both ways:</text>
<text x="20" y="380">3 into 2 → 1→1, 2→2, 3→2.</text>
<text x="350" y="360">A window per turn group: left 1 lane,</text>
<text x="350" y="380">straight 2 in the middle, right 1.</text>
<text x="680" y="360">Lane 2 is in no window: it takes the</text>
<text x="680" y="380">connections of lane 3 (dashed).</text>
<text x="20" y="418" font-size="12" fill="#5b6168">Lanes numbered from the centerline, right-hand traffic. Panels 2 and 3 draw only the connections from A.</text>
</svg>
